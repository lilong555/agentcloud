name: Native admission semantics
on:
  workflow_call:
permissions:
  contents: read
  actions: read
jobs:
  admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: agentcloud
          POSTGRES_PASSWORD: agentcloud-ci
          POSTGRES_DB: agentcloud_substrate
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U agentcloud -d agentcloud_substrate" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      AGENTCLOUD_DATABASE_URL: postgresql://agentcloud:agentcloud-ci@127.0.0.1:5432/agentcloud_substrate?sslmode=disable
      AGENTCLOUD_TEST_PG_ADMIN: postgresql://agentcloud:agentcloud-ci@127.0.0.1:5432/agentcloud_substrate?sslmode=disable
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      CUDA_VISIBLE_DEVICES: ''
      LIFECYCLE_KV_WHEEL_RUN_ID: '43012181604'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
      - name: Freeze four trials before allocating the runtime
        run: |
          for mode in legacy_fair_slots native; do
            python3 -m bench.scale --purpose admission_semantics --admission-mode "$mode" \
              --config bench/configs/admission-semantics.json \
              --schedule "artifacts/admission-$mode.json" --plan-only
          done
      - name: Restore locked sources
        run: python3 scripts/upstream.py --fetch substrate dynamo
      - name: Verify source wheel run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$LIFECYCLE_KV_WHEEL_RUN_ID" > artifacts/admission-wheel-run.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          run=json.loads(Path('artifacts/admission-wheel-run.json').read_text())
          assert run['id']==43012181604 and run['conclusion']=='success'
          assert run['path']=='.github/workflows/kv-event-wheel.yml'
          PY
      - uses: actions/download-artifact@v4
        with:
          name: kv-event-wheel
          path: artifacts/kv-event-wheel
          run-id: '43012181604'
          github-token: ${{ github.token }}
      - name: Verify provenance and install Dynamo CPU runtime
        run: |
          python3 -m experiments.dynamo.lifecycle_kv_mocker verify-wheel --output-dir artifacts/admission-wheel-check
          uv venv --python 3.12 .venv-dynamo
          uv pip install --python .venv-dynamo/bin/python -r experiments/dynamo/requirements-cpu.lock artifacts/kv-event-wheel/*.whl
          uv pip check --python .venv-dynamo/bin/python
          .venv-dynamo/bin/python scripts/verify_cpu_environment.py
      - name: Prepare gVisor MEMORY and four physical Actor slots
        run: bash scripts/ci_live_prepare.sh
      - name: Validate capacity and restart capture
        run: |
          AGENTCLOUD_ADMISSION_TEST_EXPORT="$PWD/artifacts/admission-capacity/coordinator.jsonl" \
            "$HOME/.local/share/agentcloud/go/bin/go" test -race ./internal/control \
            -run '^TestNativeInitialAdmissionPostgresConcurrencyRestartAndRelease$' -count=1 -v
      - name: Run Legacy and Native on the same Runner
        run: |
          failed=0
          for mode in legacy_fair_slots native; do
            python3 scripts/ci_substrate_access.py --schedule "artifacts/admission-$mode.json" \
              --job-minutes 100 --workflow-source "$GITHUB_SHA"
            .venv-dynamo/bin/python -u -m bench.scale --purpose admission_semantics \
              --schedule "artifacts/admission-$mode.json" || failed=1
            python3 -m bench.scale --schedule "artifacts/admission-$mode.json" --cleanup-schedule || exit 1
          done
          exit "$failed"
      - name: Collect runtime evidence
        if: always()
        run: python3 scripts/ci_live_collect.py
      - name: Release owned resources
        if: always()
        run: |
          failed=0
          for mode in legacy_fair_slots native; do
            python3 -m bench.scale --schedule "artifacts/admission-$mode.json" --cleanup-schedule || failed=1
          done
          python3 scripts/ci_live_cleanup.py || failed=1
          exit "$failed"
      - name: Stage this attempt's public evidence
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib,json,os,shutil
          from pathlib import Path
          out=Path('artifacts/admission-evidence');out.mkdir()
          for name in ('legacy_fair_slots','native'):
            source=Path(f'artifacts/admission-{name}.json')
            if not source.exists(): continue
            shutil.copy2(source,out/source.name)
            for trial in json.loads(source.read_text())['order']:
              folder=Path('docs/evidence/scale')/trial['trial_id']
              if folder.exists(): shutil.copytree(folder,out/'scale'/folder.name)
          for name in ('ci-live-runtime.json','ci-live-cleanup.json'):
            source=Path('docs/evidence')/name
            if source.exists(): shutil.copy2(source,out/name)
          source=Path('artifacts/admission-capacity')
          if source.exists(): shutil.copytree(source,out/'controlled-capacity')
          files=[dict(path=str(p.relative_to(out)),sha256=hashlib.sha256(p.read_bytes()).hexdigest(),bytes=p.stat().st_size) for p in sorted(out.rglob('*')) if p.is_file()]
          (out/'inventory.json').write_text(json.dumps(dict(source_commit=os.environ['GITHUB_SHA'],github_run_id=os.environ['GITHUB_RUN_ID'],github_run_attempt=os.environ['GITHUB_RUN_ATTEMPT'],files=files),indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-admission-evidence
          path: artifacts/admission-evidence/
          if-no-files-found: error
          retention-days: 30
