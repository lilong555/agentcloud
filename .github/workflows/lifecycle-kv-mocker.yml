name: Lifecycle KV with two CPU Mockers
run-name: Lifecycle KV Mocker ${{ inputs.suite }}

on:
  workflow_dispatch:
    inputs:
      wheel_run_id:
        description: Successful KV event runtime wheel run with matching source provenance
        type: string
        required: true
        default: '42776227181'
      suite:
        description: Smoke uses one seed and one B/C pair; full uses three seeds and three B/C pairs
        type: choice
        options: [smoke, full]
        default: smoke

permissions:
  contents: read
  actions: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      pairs: ${{ steps.plan.outputs.pairs }}
    steps:
      - id: plan
        env:
          SUITE: ${{ inputs.suite }}
        run: |
          python3 - <<'PY'
          import json, os
          full = os.environ['SUITE'] == 'full'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('matrix=' + json.dumps({'seed': [7101, 7102, 7103] if full else [7101]}) + '\n')
              f.write('pairs=' + ('3' if full else '1') + '\n')
          PY
  experiment:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: agentcloud
          POSTGRES_PASSWORD: agentcloud-ci
          POSTGRES_DB: agentcloud_substrate
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U agentcloud -d agentcloud_substrate" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      AGENTCLOUD_DATABASE_URL: postgresql://agentcloud:agentcloud-ci@127.0.0.1:5432/agentcloud_substrate?sslmode=disable
      GOMAXPROCS: '2'
      CUDA_VISIBLE_DEVICES: ''
      LIFECYCLE_KV_WHEEL_RUN_ID: ${{ inputs.wheel_run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
      - name: Validate evidence contracts
        run: python3 -m unittest tests.tooling.test_lifecycle_kv -v
      - name: Restore locked sources
        run: python3 scripts/upstream.py --fetch substrate dynamo
      - name: Verify successful wheel build
        env:
          GH_TOKEN: ${{ github.token }}
          WHEEL_RUN: ${{ inputs.wheel_run_id }}
        run: |
          gh run view "$WHEEL_RUN" --json conclusion --jq '.conclusion' > /tmp/lifecycle-wheel-conclusion
          test "$(cat /tmp/lifecycle-wheel-conclusion)" = success
      - uses: actions/download-artifact@v4
        with:
          name: kv-event-wheel
          path: artifacts/kv-event-wheel
          run-id: ${{ inputs.wheel_run_id }}
          github-token: ${{ github.token }}
      - name: Verify wheel provenance and install locked CPU runtime
        run: |
          python3 -m experiments.dynamo.lifecycle_kv_mocker verify-wheel --output-dir artifacts/wheel-check
          uv venv --python 3.12 .venv-dynamo
          uv pip install --python .venv-dynamo/bin/python -r experiments/dynamo/requirements-cpu.lock artifacts/kv-event-wheel/*.whl
          uv pip check --python .venv-dynamo/bin/python
          .venv-dynamo/bin/python scripts/verify_cpu_environment.py
      - name: Recover disposable runner disk space
        run: python3 scripts/ci_disk_prepare.py
      - name: Check two-worker routing and simulated cache accounting
        timeout-minutes: 5
        run: >-
          .venv-dynamo/bin/python -m experiments.dynamo.lifecycle_kv_mocker config
          --output-dir artifacts/lifecycle-kv-mocker/config
          --seed '${{ matrix.seed }}' --timeout-seconds 120
      - name: Prepare real Kind, gVisor, storage and WorkerPool
        run: bash scripts/ci_live_prepare.sh
      - name: Build read-only Substrate probe
        run: '"$HOME/.local/share/agentcloud/go/bin/go" build -p 2 -o artifacts/substrate/fault-probe ./tests/faults/probe'
      - name: Validate MEMORY lifecycle with affinity off and hard
        timeout-minutes: 30
        env:
          SUITE: ${{ inputs.suite }}
          SEED: ${{ matrix.seed }}
          PAIRS: ${{ needs.plan.outputs.pairs }}
        run: |
          extra=()
          if [[ "$SUITE" == full ]]; then extra+=(--routing-probes); fi
          .venv-dynamo/bin/python -m experiments.dynamo.lifecycle_kv_mocker run \
            --output-dir artifacts/lifecycle-kv-mocker/lifecycle \
            --seed "$SEED" --pairs "$PAIRS" --timeout-seconds 800 "${extra[@]}"
      - name: Collect runtime diagnostics
        if: always()
        run: python3 scripts/ci_live_collect.py
      - name: Release owned cluster resources
        if: always()
        run: python3 scripts/ci_live_cleanup.py
      - name: Stage public evidence
        if: always()
        run: python3 scripts/stage_lifecycle_kv.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lifecycle-kv-mocker-${{ inputs.suite }}-${{ matrix.seed }}
          path: artifacts/lifecycle-kv-public/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
