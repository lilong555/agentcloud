name: Validate AgentCloud
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: agentcloud
          POSTGRES_PASSWORD: agentcloud-ci
          POSTGRES_DB: agentcloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentcloud"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      AGENTCLOUD_TEST_PG_ADMIN: postgresql://agentcloud:agentcloud-ci@127.0.0.1:5432/agentcloud?sslmode=disable
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fetch locked source and apply delivery
        run: python3 scripts/upstream.py --fetch substrate dynamo
      - name: Contract and runtime verification
        run: python3 scripts/check.py --go go
      - name: Verify complete source delivery
        run: make verify-delivery
      - name: Build service
        run: go build -o bin/agentcloud ./cmd/agentcloud
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: docs/evidence/
