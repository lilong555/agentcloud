name: Pre-v3 Native DES calibration
on:
  push:
    branches: [experiment/joint-kv-gate2]
    paths:
      - '.github/workflows/prev3-calibration.yml'
      - 'bench/prev3_calibration.py'
      - 'bench/configs/prev3-calibration-plan.json'
      - 'bench/configs/prev3-calibration-independent.json'
  workflow_dispatch:
    inputs:
      plan:
        description: Frozen validation calibration input
        type: choice
        options:
          - bench/configs/prev3-calibration-independent.json
          - bench/configs/prev3-calibration-plan.json
        default: bench/configs/prev3-calibration-independent.json
permissions:
  contents: read
  actions: read
jobs:
  calibration:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: agentcloud
          POSTGRES_PASSWORD: agentcloud-ci
          POSTGRES_DB: agentcloud_substrate
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U agentcloud -d agentcloud_substrate" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      AGENTCLOUD_DATABASE_URL: postgresql://agentcloud:agentcloud-ci@127.0.0.1:5432/agentcloud_substrate?sslmode=disable
      AGENTCLOUD_TEST_PG_ADMIN: postgresql://agentcloud:agentcloud-ci@127.0.0.1:5432/agentcloud_substrate?sslmode=disable
      AGENTCLOUD_CI_WORKER_MEMORY_MIB: '1536'
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      CUDA_VISIBLE_DEVICES: ''
      LIFECYCLE_KV_WHEEL_RUN_ID: '43012181604'
      CALIBRATION_PLAN: ${{ inputs.plan || 'bench/configs/prev3-calibration-independent.json' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
      - name: Validate and freeze the paired validation slice
        run: |
          python3 -m unittest discover -s tests/tooling -p test_prev3_calibration.py -v
          python3 -m unittest discover -s tests/tooling -p test_prev3_alignment.py -v
          python3 -m bench.prev3_calibration --plan "$CALIBRATION_PLAN" --plan-only
      - name: Restore locked sources
        run: python3 scripts/upstream.py --fetch substrate dynamo
      - name: Verify the native wheel source run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/prev3-calibration/wheel
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$LIFECYCLE_KV_WHEEL_RUN_ID" > artifacts/prev3-calibration/wheel/run.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('artifacts/prev3-calibration/wheel/run.json').read_text())
          assert r['id']==43012181604 and r['conclusion']=='success'
          assert r['path']=='.github/workflows/kv-event-wheel.yml'
          PY
      - uses: actions/download-artifact@v4
        with:
          name: kv-event-wheel
          path: artifacts/kv-event-wheel
          run-id: '43012181604'
          github-token: ${{ github.token }}
      - name: Install verified native Dynamo CPU runtime
        run: |
          python3 -m experiments.dynamo.lifecycle_kv_mocker verify-wheel --output-dir artifacts/prev3-calibration/wheel/check
          uv venv --python 3.12 .venv-dynamo
          uv pip install --python .venv-dynamo/bin/python -r experiments/dynamo/requirements-cpu.lock artifacts/kv-event-wheel/*.whl
          uv pip check --python .venv-dynamo/bin/python
          .venv-dynamo/bin/python scripts/verify_cpu_environment.py
      - name: Prepare x86 gVisor MEMORY
        run: |
          test "$(uname -m)" = x86_64
          test "$(getconf PAGESIZE)" = 4096
          bash scripts/ci_live_prepare.sh
          python3 deploy/substrate/configure-matrix.py --workers 2 --worker-memory-mib 1536 --actor-memory-mib 512
          python3 scripts/ci_substrate_access.py --schedule artifacts/prev3-calibration/schedule.json --job-minutes 90 --workflow-source "$GITHUB_SHA"
      - name: Run the paired Native calibration
        timeout-minutes: 30
        run: .venv-dynamo/bin/python -u -m bench.prev3_calibration --plan "$CALIBRATION_PLAN"
      - name: Collect runtime provenance
        if: always()
        run: python3 scripts/ci_live_collect.py
      - name: Release owned Runner resources
        if: always()
        run: |
          python3 -m bench.scale --schedule artifacts/prev3-calibration/schedule.json --cleanup-schedule
      - name: Release isolated Kind cluster
        if: always()
        run: |
          python3 scripts/ci_live_cleanup.py
      - name: Stage this attempt's evidence
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib,json,os,shutil
          from pathlib import Path
          out=Path('artifacts/prev3-calibration/evidence');out.mkdir(parents=True,exist_ok=True)
          shutil.copy2(os.environ['CALIBRATION_PLAN'],out/'prev3-calibration-plan.json')
          model=Path('bench/configs/prev3-environment.json')
          if model.exists(): shutil.copy2(model,out/model.name)
          for path in (Path('artifacts/prev3-calibration/schedule.json'),Path('docs/evidence/scale/native-summary.json'),Path('docs/evidence/ci-live-runtime.json'),Path('docs/evidence/ci-live-cleanup.json')):
              if path.exists(): shutil.copy2(path,out/path.name)
          schedule=Path('artifacts/prev3-calibration/schedule.json')
          if schedule.exists():
              for item in json.loads(schedule.read_text())['order']:
                  source=Path('docs/evidence/scale')/item['trial_id']
                  if source.exists(): shutil.copytree(source,out/'trials'/source.name,dirs_exist_ok=True)
          files=[dict(path=str(p.relative_to(out)),bytes=p.stat().st_size,sha256=hashlib.sha256(p.read_bytes()).hexdigest()) for p in sorted(out.rglob('*')) if p.is_file()]
          (out/'inventory.json').write_text(json.dumps(dict(source_commit=os.environ['GITHUB_SHA'],run_id=os.environ['GITHUB_RUN_ID'],files=files),indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prev3-calibration-evidence
          path: artifacts/prev3-calibration/
          if-no-files-found: error
          retention-days: 30
