name: Real Actor scale experiments
on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Paired scheduling experiments; workload scopes include long tails, changing waits and open-loop arrivals'
        type: choice
        options: [smoke, matrix, cost-smoke, cost-matrix, workload-smoke, workload-matrix, gate1, gate2, boundary-screen, boundary-confirm, joint-smoke, joint-full]
        default: smoke
      max_parallel:
        description: 'Independent GitHub hosted runners'
        type: number
        default: 8
      native_run_id:
        description: 'Reuse a successful Native upstream validation run; empty builds native sources'
        type: string
        default: ''
      source_ref:
        description: 'Frozen experiment source ref; empty uses the workflow commit'
        type: string
        default: ''
      trial_filter:
        description: 'JSON coordinates: paired scopes use complete n/seed/scenario groups; legacy scopes also require policy'
        type: string
        default: ''
      smoke_run_id:
        description: 'Successful same-source joint-smoke run required by joint-full'
        type: string
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  joint:
    if: inputs.scope == 'joint-smoke' || inputs.scope == 'joint-full'
    uses: ./.github/workflows/joint-kv-gate2.yml
    with:
      suite: ${{ inputs.scope == 'joint-full' && 'full' || 'smoke' }}
      source_ref: ${{ inputs.source_ref }}
      max_parallel: ${{ fromJSON(format('{0}', inputs.max_parallel || 8)) }}
      smoke_run_id: ${{ inputs.smoke_run_id }}
      trial_filter: ${{ inputs.trial_filter }}
  plan:
    if: inputs.scope != 'joint-smoke' && inputs.scope != 'joint-full'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - id: plan
        env:
          SCOPE: ${{ inputs.scope || 'smoke' }}
          TRIAL_FILTER: ${{ inputs.trial_filter }}
        run: |
          python3 - <<'PY'
          import json,os
          from bench.scale_plan import matrix
          selected=matrix(os.environ['SCOPE'],os.environ.get('TRIAL_FILTER',''))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('matrix='+json.dumps(selected)+'\n')
          print(json.dumps(selected))
          PY
  native:
    if: ${{ !inputs.native_run_id && inputs.scope != 'joint-smoke' && inputs.scope != 'joint-full' }}
    uses: ./.github/workflows/native-validation.yml
  experiment:
    needs: [plan,native]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.native.result == 'success' || needs.native.result == 'skipped') }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(format('{0}', inputs.max_parallel || 8)) }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes || 120 }}
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: agentcloud
          POSTGRES_PASSWORD: agentcloud-ci
          POSTGRES_DB: agentcloud_substrate
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U agentcloud -d agentcloud_substrate" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: agentcloud
      PGPASSWORD: agentcloud-ci
      AGENTCLOUD_DATABASE_URL: postgresql://agentcloud:agentcloud-ci@127.0.0.1:5432/agentcloud_substrate?sslmode=disable
      AGENTCLOUD_TEST_PG_ADMIN: postgresql://agentcloud:agentcloud-ci@127.0.0.1:5432/agentcloud_substrate?sslmode=disable
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record paired schedule and every planned trial
        env:
          SCALE_CONFIG: ${{ matrix.config }}
          SCALE_N: ${{ matrix.n }}
          SCALE_POLICIES: ${{ matrix.policies || matrix.policy }}
          SCALE_SEED: ${{ matrix.seed }}
          SCALE_SCENARIO: ${{ matrix.scenario }}
          SCALE_HEAP: ${{ matrix.heap_mib }}
          SCALE_WAIT: ${{ matrix.wait_seconds }}
        run: |
          args=(--config "$SCALE_CONFIG" --concurrency "$SCALE_N" --policies "$SCALE_POLICIES" --seeds "$SCALE_SEED" --scenario "$SCALE_SCENARIO")
          if [ -n "$SCALE_HEAP" ]; then args+=(--heap-mib "$SCALE_HEAP"); fi
          if [ -n "$SCALE_WAIT" ]; then args+=(--wait-seconds "$SCALE_WAIT"); fi
          python3 -m bench.scale "${args[@]}" --schedule artifacts/scale-schedule.json --plan-only
      - uses: astral-sh/setup-uv@v7
      - name: Prepare locked source
        run: python3 scripts/upstream.py --fetch substrate dynamo
      - name: Await selected native validation
        if: inputs.native_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_RUN: ${{ inputs.native_run_id }}
        run: gh run watch "$NATIVE_RUN" --interval 30 --exit-status
      - uses: actions/download-artifact@v4
        with:
          name: native-cpu-wheel
          path: artifacts/native-wheels
          run-id: ${{ inputs.native_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: native-validation-evidence
          path: artifacts/native-proof
          run-id: ${{ inputs.native_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Validate reused native source and install runtime
        run: |
          python3 scripts/verify_native_proof.py artifacts/native-proof --require-runtime
          uv venv --python 3.12 .venv-dynamo
          uv pip install --python .venv-dynamo/bin/python -r experiments/dynamo/requirements-cpu.lock artifacts/native-wheels/*.whl
          uv pip check --python .venv-dynamo/bin/python
          .venv-dynamo/bin/python scripts/verify_cpu_environment.py
      - name: Prepare Kind, gVisor MEMORY, durable storage and two Workers
        run: bash scripts/ci_live_prepare.sh
      - name: Issue bounded access covering the paired job budget
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_SOURCE: ${{ github.sha }}
          JOB_MINUTES: ${{ matrix.timeout_minutes || 120 }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/contents/scripts/ci_substrate_access.py?ref=$WORKFLOW_SOURCE" \
            --jq '.content' | base64 -d > artifacts/ci_substrate_access.py
          python3 artifacts/ci_substrate_access.py --schedule artifacts/scale-schedule.json \
            --job-minutes "$JOB_MINUTES" --workflow-source "$WORKFLOW_SOURCE"
      - name: Run paired policies serially on this Runner
        run: python3 -m bench.scale --schedule artifacts/scale-schedule.json
      - name: Collect runtime and resource evidence
        if: always()
        run: python3 scripts/ci_live_collect.py
      - name: Release owned background processes and cluster
        if: always()
        run: python3 -m bench.scale --schedule artifacts/scale-schedule.json --cleanup-schedule
      - name: Release port forwards and Kind cluster
        if: always()
        run: python3 scripts/ci_live_cleanup.py
      - name: Stage current attempt evidence
        if: always()
        run: python3 scripts/stage_live_artifact.py --kind scale
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-scale-${{ matrix.scenario }}-n${{ matrix.n }}-${{ matrix.policy || 'paired' }}-s${{ matrix.seed }}
          path: artifacts/ci-live-evidence/
          if-no-files-found: error
          retention-days: 30
