request_classifier:
  type: thunderagent
  parameters:
    cache_reselect: false
    scheduler_interval_seconds: 0.05
    resume_timeout_seconds: 10.0
    session_retention_seconds: 300.0
    acting_token_weight: 1.0
    acting_decay_tau_seconds: 100.0
    buffer_per_program: 0
worker_selection:
  aggregated:
    type: thunderagent
    parameters:
      cache_reselect: false
