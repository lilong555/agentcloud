name: Joint KV Gate2
run-name: Joint KV Gate2 ${{ inputs.suite }}

on:
  workflow_call:
    inputs:
      suite:
        type: string
        required: true
      source_ref:
        type: string
        default: ''
      max_parallel:
        type: number
        default: 10
      smoke_run_id:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      suite:
        description: Five-policy smoke or 50-trial paired Gate2
        type: choice
        options: [smoke, full]
        default: smoke
      source_ref:
        description: Frozen experiment source commit; empty uses the workflow commit
        type: string
        default: ''
      max_parallel:
        description: Independent N and seed runner groups
        type: number
        default: 10
      smoke_run_id:
        description: Successful same-source five-policy smoke run required by full Gate2
        type: string
        default: ''

permissions:
  contents: read
  actions: read

env:
  CUDA_VISIBLE_DEVICES: ''
  LIFECYCLE_KV_WHEEL_RUN_ID: '43012181604'

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Validate full Gate2 smoke run
        if: inputs.suite == 'full'
        env:
          GH_TOKEN: ${{ github.token }}
          SMOKE_RUN: ${{ inputs.smoke_run_id }}
        run: |
          [[ "$SMOKE_RUN" =~ ^[1-9][0-9]*$ ]]
          gh run view "$SMOKE_RUN" --json conclusion --jq '.conclusion' > /tmp/joint-smoke-conclusion
          test "$(cat /tmp/joint-smoke-conclusion)" = success
      - uses: actions/download-artifact@v4
        if: inputs.suite == 'full'
        with:
          name: joint-kv-smoke-n4-s7101
          path: artifacts/joint-kv-smoke-proof
          run-id: ${{ inputs.smoke_run_id }}
          github-token: ${{ github.token }}
      - name: Verify five-policy smoke evidence
        if: inputs.suite == 'full'
        env:
          SMOKE_RUN: ${{ inputs.smoke_run_id }}
        run: >-
          python3 -m bench.joint_plan --suite full
          --verify-smoke artifacts/joint-kv-smoke-proof
          --smoke-run-id "$SMOKE_RUN" --source-commit "$(git rev-parse HEAD)"
      - id: plan
        name: Validate frozen workload and paired runner matrix
        env:
          SUITE: ${{ inputs.suite }}
        run: |
          python3 - <<'PY'
          import json, os
          from bench.joint_plan import matrix
          selected = matrix(os.environ['SUITE'], validate=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as handle:
              handle.write('matrix=' + json.dumps(selected) + '\n')
          print(json.dumps(selected), flush=True)
          PY

  experiment:
    needs: plan
    name: ${{ matrix.suite }} n${{ matrix.n }} s${{ matrix.seed }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(format('{0}', inputs.max_parallel || 10)) }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: agentcloud
          POSTGRES_PASSWORD: agentcloud-ci
          POSTGRES_DB: agentcloud_substrate
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U agentcloud -d agentcloud_substrate" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: agentcloud
      PGPASSWORD: agentcloud-ci
      AGENTCLOUD_DATABASE_URL: postgresql://agentcloud:agentcloud-ci@127.0.0.1:5432/agentcloud_substrate?sslmode=disable
      AGENTCLOUD_TEST_PG_ADMIN: postgresql://agentcloud:agentcloud-ci@127.0.0.1:5432/agentcloud_substrate?sslmode=disable
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      JOINT_KV_SMOKE_RUN_ID: ${{ inputs.smoke_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record every planned trial before runtime preparation
        env:
          JOINT_CONFIG: ${{ matrix.config }}
          JOINT_N: ${{ matrix.n }}
          JOINT_SEED: ${{ matrix.seed }}
          JOINT_POLICIES: ${{ matrix.policies }}
          JOINT_SUITE: ${{ matrix.suite }}
        run: |
          mkdir -p artifacts
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          config = Path(os.environ['JOINT_CONFIG'])
          values = {key: os.environ.get(key) for key in ('JOINT_CONFIG','JOINT_N','JOINT_SEED','JOINT_POLICIES','JOINT_SUITE','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT','GITHUB_JOB','GITHUB_SHA','RUNNER_NAME')}
          values['config_sha256'] = hashlib.sha256(config.read_bytes()).hexdigest()
          values['wheel_run_id'] = os.environ['LIFECYCLE_KV_WHEEL_RUN_ID']
          Path('artifacts/joint-kv-inputs.json').write_text(json.dumps(values, indent=2) + '\n')
          PY
          python3 -m bench.scale --config "$JOINT_CONFIG" --concurrency "$JOINT_N" \
            --seeds "$JOINT_SEED" --policies "$JOINT_POLICIES" \
            --schedule artifacts/joint-kv-schedule.json --plan-only
      - uses: astral-sh/setup-uv@v7
      - name: Validate joint KV evidence contracts
        run: python3 -m unittest tests.tooling.test_joint_ci tests.tooling.test_joint_routing -v
      - name: Verify frozen official Mocker calibration
        run: python3 -m experiments.dynamo.joint_calibration --check
      - name: Restore frozen Substrate and Dynamo sources
        run: python3 scripts/upstream.py --fetch substrate dynamo
      - name: Record successful wheel build and native test jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$LIFECYCLE_KV_WHEEL_RUN_ID" > artifacts/joint-kv-wheel-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$LIFECYCLE_KV_WHEEL_RUN_ID/jobs?per_page=100" > artifacts/joint-kv-wheel-jobs.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          run = json.loads(Path('artifacts/joint-kv-wheel-run.json').read_text())
          assert run['id'] == 43012181604 and run['conclusion'] == 'success'
          assert run['path'] == '.github/workflows/kv-event-wheel.yml'
          PY
      - uses: actions/download-artifact@v4
        with:
          name: kv-event-wheel
          path: artifacts/kv-event-wheel
          run-id: '43012181604'
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: kv-event-build-log
          path: artifacts
          run-id: '43012181604'
          github-token: ${{ github.token }}
      - name: Verify wheel provenance and install locked CPU runtime
        run: |
          python3 -m experiments.dynamo.lifecycle_kv_mocker verify-wheel \
            --output-dir artifacts/joint-kv-wheel-check > artifacts/joint-kv-wheel-check.json
          uv venv --python 3.12 .venv-dynamo
          uv pip install --python .venv-dynamo/bin/python -r experiments/dynamo/requirements-cpu.lock artifacts/kv-event-wheel/*.whl
          uv pip check --python .venv-dynamo/bin/python
          .venv-dynamo/bin/python scripts/verify_cpu_environment.py
          .venv-dynamo/bin/python - <<'PY'
          from experiments.dynamo.lifecycle_kv_mocker import verify_wheel
          verify_wheel('artifacts/kv-event-wheel', installed=True)
          PY
      - name: Observe cache reselection and native affinity on two Mockers
        if: inputs.suite == 'smoke'
        timeout-minutes: 20
        run: >-
          .venv-dynamo/bin/python -u -m experiments.dynamo.joint_routing
          --output-dir artifacts/joint-kv-routing --seed 7101 --timeout-seconds 600
      - uses: actions/download-artifact@v4
        if: inputs.suite == 'full'
        with:
          name: joint-kv-routing-s7101
          path: artifacts/joint-kv-routing
          run-id: ${{ inputs.smoke_run_id }}
          github-token: ${{ github.token }}
      - name: Prepare Kind, gVisor MEMORY, durable storage and two Workers
        run: bash scripts/ci_live_prepare.sh
      - name: Issue bounded access for five serial policies and cleanup
        run: >-
          python3 scripts/ci_substrate_access.py --schedule artifacts/joint-kv-schedule.json
          --job-minutes '${{ matrix.timeout_minutes }}' --workflow-source '${{ github.sha }}'
      - name: Execute five paired policies serially
        run: |
          set -o pipefail
          .venv-dynamo/bin/python -u -m bench.scale --schedule artifacts/joint-kv-schedule.json \
            2>&1 | tee artifacts/joint-kv-runner.log
      - name: Collect runtime and resource diagnostics
        if: always()
        run: python3 scripts/ci_live_collect.py
      - name: Release owned trial process groups
        if: always()
        run: python3 -m bench.scale --schedule artifacts/joint-kv-schedule.json --cleanup-schedule
      - name: Release port forwards and Kind cluster
        if: always()
        run: python3 scripts/ci_live_cleanup.py
      - name: Record current run and actual job identifiers
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > artifacts/joint-kv-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" > artifacts/joint-kv-jobs.json
      - name: Stage this runner's public raw evidence
        if: always()
        run: python3 scripts/stage_joint_kv.py --suite '${{ matrix.suite }}' --schedule artifacts/joint-kv-schedule.json
      - name: Preserve independent public trial and routing records
        if: always()
        run: python3 scripts/stage_joint_kv.py --suite '${{ matrix.suite }}' --fallback
      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.suite == 'smoke' }}
        with:
          name: joint-kv-routing-s7101
          path: artifacts/joint-kv-fallback/routing/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload independent public raw records
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: joint-kv-raw-${{ matrix.suite }}-n${{ matrix.n }}-s${{ matrix.seed }}
          path: artifacts/joint-kv-fallback/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: joint-kv-${{ matrix.suite }}-n${{ matrix.n }}-s${{ matrix.seed }}
          path: artifacts/joint-kv-public/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
